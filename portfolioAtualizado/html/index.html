<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Clauber</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Bloco azul que fica atrás do vidro para gerar o efeito visual -->
    <div class="background-blue-bar"></div>

    <!-- Estrutura principal do Portfólio (O Vidro) -->
    <main class="portfolio-card">
        
        <!-- Menu Superior -->
        <header>
            <div class="logo">PORTFOLIO</div>
            <nav>
                <a href="#">Home</a>
                <a href="#">Projetos</a>
                <a href="#">Skills</a>
                <a href="#">Currículo</a>
                <a href="#">Contato</a>
            </nav>
        </header>

        <!-- Seção de Introdução e Foto -->
        <section class="hero-section">
            <h1 class="introduction-text">
                Olá me chamo Clauber! Sou desenvolvedor full Stack
            </h1>
            <div class="profile-wrapper">
                <!-- Link temporário de imagem (substitua pelo arquivo da sua foto) -->
                <img src="https://unsplash.com" alt="Clauber - Desenvolvedor Full Stack">
            </div>
        </section>

        <!-- Seção Inferior: Título de Projetos e Botões de Filtro -->
        <section class="projects-section">
            <h2 class="projects-title">Projetos</h2>
            
            <div class="filter-container">
                <button class="btn-filter">Todos</button>
                <button class="btn-filter">Front-End 🖥️</button>
                <button class="btn-filter">Back-End 🗄️</button>
                <button class="btn-filter">Full Stack</button>
                <button class="btn-filter">SQL/Database</button>
            </div>
        </section>

    </main>

</body>
</html>
